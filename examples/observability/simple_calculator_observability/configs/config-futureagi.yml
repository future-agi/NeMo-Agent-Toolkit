# Future AGI: set FI_API_KEY and FI_SECRET_KEY in the environment.
# FI_PROJECT_NAME optionally overrides the simple_calculator project below.

general:
  telemetry:
    logging:
      console:
        _type: console
        level: WARN
      file:
        _type: file
        path: ./.tmp/nat_simple_calculator.log
        level: DEBUG
    tracing:
      futureagi:
        _type: futureagi
        project: ${FI_PROJECT_NAME:-simple_calculator}
        # Credentials are read from FI_API_KEY and FI_SECRET_KEY.
        # protocol: grpc  # HTTP is the default.

  front_end:
    _type: fastapi
    endpoints:
      - path: /get_time
        method: POST
        description: Gets the current time
        function_name: current_datetime
    cors:
      allow_origins: ['*']

function_groups:
  calculator:
    _type: calculator

functions:
  current_datetime:
    _type: current_datetime

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.0
    max_tokens: 1024


workflow:
  _type: react_agent
  tool_names: [calculator, current_datetime]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
